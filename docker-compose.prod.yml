services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "127.0.0.1:${SCOUTCOMP_BACKEND_PORT:-8001}:8000"
    volumes:
      - ./data:/app/data
    environment:
      - SCOUTCOMP_SECRET_KEY=${SCOUTCOMP_SECRET_KEY}
      - SCOUTCOMP_DB_URL=${SCOUTCOMP_DB_URL}
      - SCOUTCOMP_DEVELOPER_MODE=false
      - SCOUTCOMP_WEB_MEDIA_DIR=/app/data/web-media
      - SCOUTCOMP_SITE_PUBLIC_URL=${SCOUTCOMP_SITE_PUBLIC_URL}
      - SCOUTCOMP_TIMEZONE=${SCOUTCOMP_TIMEZONE:-Europe/Prague}
      - SCOUTCOMP_PUSH_ENABLED=${SCOUTCOMP_PUSH_ENABLED:-false}
      - SCOUTCOMP_PUSH_VAPID_PUBLIC_KEY=${SCOUTCOMP_PUSH_VAPID_PUBLIC_KEY:-}
      - SCOUTCOMP_PUSH_VAPID_PRIVATE_KEY=${SCOUTCOMP_PUSH_VAPID_PRIVATE_KEY:-}
      - SCOUTCOMP_PUSH_VAPID_SUBJECT=${SCOUTCOMP_PUSH_VAPID_SUBJECT:-}
      - SCOUTCOMP_PUSH_ALLOWED_HOSTS=${SCOUTCOMP_PUSH_ALLOWED_HOSTS:-fcm.googleapis.com,updates.push.services.mozilla.com,web.push.apple.com,.notify.windows.com}
      - SCOUTCOMP_PUSH_DELIVERY_WORKERS=${SCOUTCOMP_PUSH_DELIVERY_WORKERS:-10}
      - SCOUTCOMP_PUSH_DELIVERY_BATCH_SIZE=${SCOUTCOMP_PUSH_DELIVERY_BATCH_SIZE:-100}
      - SCOUTCOMP_PUSH_DELIVERY_MAX_ATTEMPTS=${SCOUTCOMP_PUSH_DELIVERY_MAX_ATTEMPTS:-7}
      - SCOUTCOMP_PUSH_DELIVERY_POLL_SECONDS=${SCOUTCOMP_PUSH_DELIVERY_POLL_SECONDS:-1}
      - SCOUTCOMP_PUSH_DELIVERY_TTL_SECONDS=${SCOUTCOMP_PUSH_DELIVERY_TTL_SECONDS:-86400}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  site:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: uvicorn app.site_app:app --host 0.0.0.0 --port 8090 --proxy-headers --forwarded-allow-ips=*
    ports:
      - "127.0.0.1:${SCOUTCOMP_SITE_PORT:-8090}:8090"
    volumes:
      - ./data:/app/data
    environment:
      - SCOUTCOMP_SECRET_KEY=${SCOUTCOMP_SECRET_KEY}
      - SCOUTCOMP_DB_URL=${SCOUTCOMP_DB_URL}
      - SCOUTCOMP_DEVELOPER_MODE=false
      - SCOUTCOMP_WEB_MEDIA_DIR=/app/data/web-media
      - SCOUTCOMP_SITE_PUBLIC_URL=${SCOUTCOMP_SITE_PUBLIC_URL}
      - SCOUTCOMP_TIMEZONE=${SCOUTCOMP_TIMEZONE:-Europe/Prague}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    ports:
      - "127.0.0.1:${SCOUTCOMP_FRONTEND_PORT:-3200}:80"
    depends_on:
      backend:
        condition: service_healthy
      site:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/robots.txt"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
