app:
  secret_key: "super-secret"
  default_language: "cs"
  supported_languages: ["cs", "en"]
  token:
    access_expire_minutes: 30
    refresh_expire_minutes: 10080
  features:
    require_email_verification: false
    allow_self_registration: true
  developer_mode: true

database:
  engine: "sqlite"
  url: "sqlite:///./database.db"

site:
  host: "0.0.0.0"
  port: 8090
  # Public address of the hosted site (used for links from the app, e.g. behind nginx).
  # public_url: "https://web.oddil.cz"

  # sample config for PostgreSQL:
  # engine: "postgresql"
  # url: "postgresql://scout:scout123@db:5432/competition"

  # sample config for MySQL:
  # engine: "mysql"
  # url: "mysql+pymysql://scout:scout123@db:3306/competition"
